<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Sales page staircase</title>
  <desc id="desc">A staircase diagram of the sales page sequence from problem to CTA.</desc>
  <defs>
    <style>
      .bg{fill:#faf7f0}.step{fill:#fff;stroke:#dcd4c3;stroke-width:3}.navy{fill:#16305a}.soft{fill:#4a5468}.gold{fill:#b8860b}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.serif{font-family:Georgia,serif}.sans{font-family:Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text x="75" y="92" class="serif navy" font-size="50" font-weight="700">Sales page sequence</text>
  <text x="77" y="132" class="sans soft" font-size="24">A page creates awareness in order. It does not guess it.</text>
  <g transform="translate(100 625)"><rect width="260" height="70" rx="12" class="step"/><text x="24" y="44" class="sans navy" font-size="23" font-weight="700">1. Problem</text></g>
  <g transform="translate(260 535)"><rect width="260" height="70" rx="12" class="step"/><text x="24" y="44" class="sans navy" font-size="23" font-weight="700">2. Why it exists</text></g>
  <g transform="translate(420 445)"><rect width="270" height="70" rx="12" class="step"/><text x="24" y="44" class="sans navy" font-size="23" font-weight="700">3. Why DIY fails</text></g>
  <g transform="translate(590 355)"><rect width="250" height="70" rx="12" class="step"/><text x="24" y="44" class="sans navy" font-size="23" font-weight="700">4. Product</text></g>
  <g transform="translate(745 265)"><rect width="250" height="70" rx="12" class="step"/><text x="24" y="44" class="sans navy" font-size="23" font-weight="700">5. Offer</text></g>
  <g transform="translate(900 175)"><rect width="220" height="70" rx="12" fill="#16305a"/><text x="24" y="44" class="sans" fill="#fff" font-size="23" font-weight="700">6. CTA</text></g>
  <path d="M228 612 L973 170" fill="none" stroke="#b8860b" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 18"/>
  <rect x="112" y="205" width="385" height="120" rx="20" fill="#f2ede2" stroke="#dcd4c3" stroke-width="3"/>
  <text x="145" y="250" class="mono gold" font-size="17" font-weight="700">DO NOT SKIP</text>
  <text x="145" y="292" class="sans navy" font-size="24" font-weight="700">The reader must feel the need</text>
  <text x="145" y="322" class="sans soft" font-size="20">before they hear the pitch.</text>
</svg>
