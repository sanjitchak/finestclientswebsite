<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Weekly creative refresh calendar</title>
  <desc id="desc">A Monday, Wednesday, Friday, and monthly calendar routine for creative refresh.</desc>
  <defs>
    <style>
      .bg{fill:#faf7f0}.card{fill:#fff;stroke:#dcd4c3;stroke-width:3}.navy{fill:#16305a}.soft{fill:#4a5468}.gold{fill:#b8860b}.good{fill:#2e6b4f}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.serif{font-family:Georgia,serif}.sans{font-family:Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text x="75" y="92" class="serif navy" font-size="50" font-weight="700">Refresh before fatigue</text>
  <text x="77" y="132" class="sans soft" font-size="24">A simple weekly rhythm keeps the pipeline full.</text>
  <g transform="translate(85 210)">
    <rect width="250" height="300" rx="22" class="card"/><text x="35" y="60" class="mono gold" font-size="18" font-weight="700">MONDAY</text><text x="35" y="118" class="serif navy" font-size="34" font-weight="700">Launch</text><text x="35" y="168" class="sans soft" font-size="23">5 new creatives</text><text x="35" y="205" class="sans soft" font-size="23">from stockpile.</text>
  </g>
  <g transform="translate(365 210)">
    <rect width="250" height="300" rx="22" class="card"/><text x="35" y="60" class="mono gold" font-size="18" font-weight="700">WEDNESDAY</text><text x="35" y="118" class="serif navy" font-size="34" font-weight="700">Check</text><text x="35" y="168" class="sans soft" font-size="23">10 minute scan.</text><text x="35" y="205" class="sans soft" font-size="23">Kill obvious losers.</text>
  </g>
  <g transform="translate(645 210)">
    <rect width="250" height="300" rx="22" class="card"/><text x="35" y="60" class="mono gold" font-size="18" font-weight="700">FRIDAY</text><text x="35" y="118" class="serif navy" font-size="34" font-weight="700">Plan</text><text x="35" y="168" class="sans soft" font-size="23">Pick winners.</text><text x="35" y="205" class="sans soft" font-size="23">Prepare next batch.</text>
  </g>
  <g transform="translate(925 210)">
    <rect width="190" height="300" rx="22" fill="#16305a"/><text x="35" y="60" class="mono" fill="#f3e8ce" font-size="18" font-weight="700">MONTHLY</text><text x="35" y="118" class="serif" fill="#fff" font-size="34" font-weight="700">Batch</text><text x="35" y="168" class="sans" fill="#fff" font-size="23">20-30</text><text x="35" y="205" class="sans" fill="#fff" font-size="23">new ideas.</text>
  </g>
  <rect x="205" y="610" width="790" height="78" rx="39" fill="#e8f1eb" stroke="#cbdfd2" stroke-width="3"/>
  <text x="600" y="659" text-anchor="middle" class="sans good" font-size="29" font-weight="700">Light refresh every 5-7 days. Full refresh monthly.</text>
</svg>
