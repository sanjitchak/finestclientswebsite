<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">SMS screenshot style sample ad</title>
  <desc id="desc">A square ad mockup using a phone SMS conversation to show a personal ad format.</desc>
  <defs>
    <style>
      .bg{fill:#16305a}.phone{fill:#101827}.screen{fill:#faf7f0}.bubble1{fill:#fff;stroke:#dcd4c3;stroke-width:3}.bubble2{fill:#e8f1eb}.navy{fill:#16305a}.soft{fill:#4a5468}.gold{fill:#b8860b}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.serif{font-family:Georgia,serif}.sans{font-family:Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1080" height="1080"/>
  <text x="540" y="100" text-anchor="middle" class="mono" fill="#f3e8ce" font-size="22" font-weight="700">SMS SCREENSHOT FORMAT</text>
  <text x="540" y="160" text-anchor="middle" class="serif" fill="#fff" font-size="58" font-weight="700">Looks personal. Feels native.</text>
  <rect x="270" y="220" width="540" height="780" rx="52" class="phone"/>
  <rect x="300" y="268" width="480" height="690" rx="34" class="screen"/>
  <rect x="336" y="310" width="408" height="58" rx="29" fill="#f2ede2"/>
  <text x="540" y="348" text-anchor="middle" class="sans navy" font-size="25" font-weight="700">Today 9:41 AM</text>
  <g transform="translate(335 415)">
    <rect width="325" height="94" rx="26" class="bubble1"/>
    <text x="28" y="38" class="sans navy" font-size="24" font-weight="700">Why are leads showing up</text>
    <text x="28" y="70" class="sans navy" font-size="24" font-weight="700">with zero buying intent?</text>
  </g>
  <g transform="translate(420 540)">
    <rect width="320" height="126" rx="26" class="bubble2"/>
    <text x="28" y="40" class="sans navy" font-size="24" font-weight="700">Because the form asks</text>
    <text x="28" y="73" class="sans navy" font-size="24" font-weight="700">income...</text>
    <text x="28" y="106" class="sans navy" font-size="24" font-weight="700">not spending behavior.</text>
  </g>
  <g transform="translate(335 700)">
    <rect width="360" height="126" rx="26" class="bubble1"/>
    <text x="28" y="40" class="sans navy" font-size="24" font-weight="700">Ask what they bought.</text>
    <text x="28" y="73" class="sans navy" font-size="24" font-weight="700">Ask how much.</text>
    <text x="28" y="106" class="sans navy" font-size="24" font-weight="700">Then track the spenders.</text>
  </g>
  <rect x="360" y="870" width="360" height="52" rx="26" fill="#b8860b"/>
  <text x="540" y="904" text-anchor="middle" class="mono" fill="#fff" font-size="20" font-weight="700">Click to learn more</text>
</svg>
