<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Raw native sample Facebook ad</title>
  <desc id="desc">A square sample ad that looks like a raw phone photo post, focused on qualified leads.</desc>
  <defs>
    <style>
      .bg{fill:#f2ede2}.paper{fill:#fffdf8;stroke:#d7cdb9;stroke-width:5}.navy{fill:#16305a}.soft{fill:#4a5468}.gold{fill:#b8860b}.green{fill:#2e6b4f}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.serif{font-family:Georgia,serif}.sans{font-family:Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1080" height="1080"/>
  <rect x="80" y="70" width="920" height="940" rx="36" class="paper"/>
  <circle cx="160" cy="155" r="36" fill="#16305a"/><text x="160" y="169" text-anchor="middle" fill="#fff" class="sans" font-size="36" font-weight="700">F</text>
  <text x="220" y="145" class="sans navy" font-size="31" font-weight="700">Finest Clients</text>
  <text x="220" y="183" class="sans soft" font-size="23">Sponsored</text>
  <rect x="135" y="250" width="810" height="520" rx="28" fill="#faf7f0" stroke="#dcd4c3" stroke-width="4"/>
  <rect x="190" y="305" width="700" height="60" rx="30" fill="#16305a"/>
  <text x="540" y="346" text-anchor="middle" fill="#fff" class="sans" font-size="31" font-weight="700">Stop chasing people with money</text>
  <circle cx="320" cy="520" r="110" fill="#f3e8ce"/><text x="320" y="555" text-anchor="middle" class="serif gold" font-size="100" font-weight="700">$</text>
  <path d="M470 530 L600 530" stroke="#b8860b" stroke-width="12" stroke-linecap="round"/><polygon points="625,530 585,508 585,552" fill="#b8860b"/>
  <circle cx="760" cy="520" r="110" fill="#e8f1eb"/><text x="760" y="554" text-anchor="middle" class="sans green" font-size="80" font-weight="700">BUY</text>
  <text x="540" y="685" text-anchor="middle" class="sans navy" font-size="42" font-weight="700">Find buyers who already spend.</text>
  <text x="135" y="850" class="sans navy" font-size="36" font-weight="700">Qualified leads are not richer.</text>
  <text x="135" y="902" class="sans soft" font-size="31">They are people who have already bought help.</text>
  <rect x="135" y="940" width="245" height="58" rx="29" fill="#b8860b"/>
  <text x="258" y="978" text-anchor="middle" class="mono" fill="#fff" font-size="23" font-weight="700">Learn More</text>
</svg>
