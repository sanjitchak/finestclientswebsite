<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Video motion graphics placement</title>
  <desc id="desc">A vertical video mockup showing compact graphics above the speaker head without covering face or subtitles.</desc>
  <defs>
    <style>
      .bg{fill:#f2ede2}.phone{fill:#101827}.screen{fill:#16305a}.sub{fill:#0e2244}.navy{fill:#16305a}.soft{fill:#4a5468}.gold{fill:#b8860b}.good{fill:#2e6b4f}.bad{fill:#8c3a3a}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.serif{font-family:Georgia,serif}.sans{font-family:Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text x="90" y="92" class="serif navy" font-size="48" font-weight="700">Ad Video Codex</text>
  <text x="92" y="132" class="sans soft" font-size="24">Graphics follow the subtitle meaning, while the face and captions stay clear.</text>
  <rect x="455" y="80" width="290" height="675" rx="50" class="phone"/>
  <rect x="480" y="130" width="240" height="575" rx="30" class="screen"/>
  <circle cx="600" cy="390" r="82" fill="#f3e8ce"/>
  <rect x="530" y="470" width="140" height="165" rx="62" fill="#f3e8ce"/>
  <circle cx="574" cy="378" r="8" fill="#16305a"/><circle cx="626" cy="378" r="8" fill="#16305a"/><path d="M575 418 Q600 438 625 418" fill="none" stroke="#16305a" stroke-width="7" stroke-linecap="round"/>
  <rect x="500" y="176" width="80" height="70" rx="16" fill="#e8f1eb"/><text x="540" y="221" text-anchor="middle" class="sans good" font-size="36" font-weight="700">?</text>
  <rect x="620" y="178" width="80" height="70" rx="16" fill="#f3e8ce"/><text x="660" y="223" text-anchor="middle" class="sans gold" font-size="32" font-weight="700">$</text>
  <rect x="502" y="642" width="196" height="42" rx="12" class="sub"/><text x="600" y="670" text-anchor="middle" fill="#fff" class="sans" font-size="18" font-weight="700">Subtitle stays readable</text>
  <g transform="translate(820 238)">
    <rect width="280" height="80" rx="18" fill="#e8f1eb" stroke="#cbdfd2" stroke-width="3"/><text x="30" y="50" class="sans good" font-size="24" font-weight="700">Above head area</text>
  </g>
  <g transform="translate(820 360)">
    <rect width="280" height="80" rx="18" fill="#f5e9e7" stroke="#e4cbc6" stroke-width="3"/><text x="30" y="50" class="sans bad" font-size="24" font-weight="700">Do not cover face</text>
  </g>
  <g transform="translate(820 482)">
    <rect width="280" height="80" rx="18" fill="#f5e9e7" stroke="#e4cbc6" stroke-width="3"/><text x="30" y="50" class="sans bad" font-size="24" font-weight="700">Do not cover captions</text>
  </g>
  <text x="90" y="680" class="mono gold" font-size="20" font-weight="700">EXPORTS</text>
  <text x="90" y="720" class="sans navy" font-size="28" font-weight="700">Vertical + 1000 x 1000 square</text>
</svg>
